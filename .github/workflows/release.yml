name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: build archives
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          for goos in linux darwin windows; do
            for goarch in amd64 arm64; do
              out="dist/ghfetch_${goos}_${goarch}"
              ext=""
              if [ "$goos" = "windows" ]; then ext=".exe"; fi
              GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
                go build -trimpath -ldflags "-s -w -X main.version=${version}" \
                -o "${out}${ext}" .
              if [ "$goos" = "windows" ]; then
                (cd dist && zip -q "ghfetch_${version}_${goos}_${goarch}.zip" "ghfetch_${goos}_${goarch}${ext}")
              else
                tar -czf "dist/ghfetch_${version}_${goos}_${goarch}.tar.gz" -C dist "ghfetch_${goos}_${goarch}"
              fi
              rm -f "${out}${ext}"
            done
          done
          (cd dist && sha256sum ./* > "ghfetch_${version}_checksums.txt")

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true