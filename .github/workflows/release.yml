name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  # Needed to sign the build provenance attestation with a short-lived Sigstore
  # certificate issued by GitHub (no key to manage, nothing to store).
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: build archives
        run: |
          set -euo pipefail
          mkdir -p dist stage
          version="${GITHUB_REF_NAME#v}"
          for goos in linux darwin windows; do
            for goarch in amd64 arm64; do
              ext=""
              if [ "$goos" = "windows" ]; then ext=".exe"; fi
              # Stage the binary under its plain name so the archive contains
              # "ghfetch" (or "ghfetch.exe"), not "ghfetch_linux_amd64".
              rm -rf stage/*
              GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
                go build -trimpath -ldflags "-s -w -X main.version=${version}" \
                -o "stage/ghfetch${ext}" .
              if [ "$goos" = "windows" ]; then
                (cd stage && zip -q "../dist/ghfetch_${version}_${goos}_${goarch}.zip" "ghfetch${ext}")
              else
                tar -czf "dist/ghfetch_${version}_${goos}_${goarch}.tar.gz" -C stage "ghfetch"
              fi
            done
          done
          (cd dist && sha256sum ./* > "ghfetch_${version}_checksums.txt")

      - name: attest build provenance
        uses: actions/attest@v4
        with:
          # Every archive and the checksum manifest become attested subjects:
          # `gh attestation verify <file> --repo xiemocun/ghfetch` then proves
          # the bytes were produced by this workflow, not just uploaded by hand.
          subject-path: 'dist/*'

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true